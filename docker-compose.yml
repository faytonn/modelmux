# Gateway + Prometheus.
#
#   docker compose up --build
#   gateway:    http://localhost:8080   (POST /v1/chat, GET /metrics)
#   prometheus: http://localhost:9090
#
# API keys are read from your shell or a local .env file (git-ignored).
# The default config uses mock providers only, so no keys are needed.
# Set MODELMUX_CONFIG=/etc/modelmux/config.real.yaml to use real providers.

services:
  modelmux:
    build: .
    ports:
      - "8080:8080"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    # --admin enables PATCH /admin/mocks/{name} so the load test can inject an
    # outage. It is unauthenticated: this compose file is a local demo setup.
    command: ["--config", "${MODELMUX_CONFIG:-/etc/modelmux/config.yaml}", "--admin"]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - modelmux
