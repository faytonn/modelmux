# ModelMux configuration for real providers.
#
#   export ANTHROPIC_API_KEY=...   # or put them in a local .env (git-ignored)
#   export OPENAI_API_KEY=...
#   python -m modelmux --config config.real.yaml
#
# A provider whose key is missing is skipped at startup with a warning.
# Model IDs, context windows and prices change over time: check each
# provider's docs and pricing page before relying on the cost numbers below.
# Prices are USD per 1K tokens.

server:
  addr: ":8080"
  request_timeout: 60s
  default_max_tokens: 512

routing:
  policy: rule
  latency_window: 100
  rules:
    # Claude Haiku 5.5 costs 5x more for prompts over 100K tokens
    # ($0.0005 / $0.0025 per 1K), which this config's flat prices don't
    # model. Send long prompts to the cheapest model without that surcharge.
    - name: long-prompts-skip-haiku-surcharge
      min_prompt_tokens: 100000
      prefer: [openai/gpt-4.1-mini]

retry:
  max_attempts: 3
  base_delay: 250ms
  max_delay: 4s
  max_retry_after: 10s

breaker:
  failure_threshold: 5
  open_timeout: 30s

providers:
  - name: anthropic
    type: anthropic
    api_key_env: ANTHROPIC_API_KEY
    base_url: https://api.anthropic.com
    attempt_timeout: 30s
    models:
      # Haiku prices are for prompts up to 100K tokens; see the rule above.
      - name: claude-haiku-5-5
        context_window: 1000000
        input_price_per_1k: 0.0001
        output_price_per_1k: 0.0005
        quality: 2
      - name: claude-sonnet-5-5
        context_window: 1000000
        input_price_per_1k: 0.002
        output_price_per_1k: 0.010
        quality: 4

  - name: openai
    type: openai
    api_key_env: OPENAI_API_KEY
    base_url: https://api.openai.com
    attempt_timeout: 30s
    models:
      - name: gpt-4.1-mini
        context_window: 1000000
        input_price_per_1k: 0.0004
        output_price_per_1k: 0.0016
        quality: 1
      - name: gpt-4.1
        context_window: 1000000
        input_price_per_1k: 0.002
        output_price_per_1k: 0.008
        quality: 3
