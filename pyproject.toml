[project]
name = "modelmux"
version = "0.1.0"
description = "A small LLM gateway: cost/latency/rule/quality routing, retries with jitter, fallbacks, circuit breakers and Prometheus metrics"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "prometheus-client>=0.21",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/modelmux"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "ASYNC", "RUF"]
# Router.chat takes a timeout on purpose: it owns the request budget and turns
# it into a deadline that the retry loop also reads.
ignore = ["ASYNC109"]
