# ModelMux configuration.
# This default config uses only mock providers, so it runs without API keys.
# API keys are never stored here: real providers name an environment variable
# (api_key_env) that holds the key.

server:
  addr: ":8080"
  request_timeout: 15s      # budget for the whole request, including retries and fallbacks
  default_max_tokens: 512

routing:
  # Default policy when a request has no routing_hint: cost | latency | quality | rule.
  # Hints override it per request: cheap -> cost, fast -> latency, quality -> quality.
  policy: rule
  latency_window: 100       # recent samples per provider used to compute p95
  rules:                    # first match wins; unmatched requests fall back to cost order
    - name: long-prompts-to-large-context
      min_prompt_tokens: 3000
      prefer: [mock-premium/premium-large]

retry:                      # per candidate in the fallback chain
  max_attempts: 3           # first try included
  base_delay: 100ms         # backoff: random in [0, min(max_delay, base_delay * 2^(n-1)))
  max_delay: 2s
  max_retry_after: 5s       # a longer Retry-After means fall back instead of waiting

breaker:                    # one circuit breaker per provider
  failure_threshold: 5      # consecutive 5xx/429/timeout/network failures before opening
  open_timeout: 10s         # then skip the provider for this long before sending one probe

# Prices are made-up values for the mocks, in USD per 1K tokens.
providers:
  - name: mock-cheap
    type: mock
    attempt_timeout: 2s
    mock:
      latency: 80ms
      jitter: 40ms
    models:
      - name: cheap-small
        context_window: 8000
        input_price_per_1k: 0.0002
        output_price_per_1k: 0.0008
        quality: 1

  - name: mock-flaky
    type: mock
    attempt_timeout: 2s
    mock:
      latency: 40ms
      jitter: 20ms
      error_rate: 0.3
      rate_limit_rate: 0.1
      retry_after: 300ms
    models:
      - name: fast-medium
        context_window: 32000
        input_price_per_1k: 0.001
        output_price_per_1k: 0.003
        quality: 2

  - name: mock-premium
    type: mock
    attempt_timeout: 5s
    mock:
      latency: 400ms
      jitter: 200ms
    models:
      - name: premium-large
        context_window: 200000
        input_price_per_1k: 0.003
        output_price_per_1k: 0.015
        quality: 3
